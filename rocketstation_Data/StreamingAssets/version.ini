- <color=yellow>Fixed</color> sounds not playing on Landing pad tank connectors.
- <color=yellow>Fixed</color> Flickering lander tooltip on worlds with more than one storm type.
<size=20><b>[Version 0.2.6126.26780]</b></size>
- <color=yellow>Changed</color> Disabled in-progress content for patch.
<size=20><b>[Version 0.2.6125.26778]</b></size>
- <color=yellow>Fixed</color> Swapping Items would cause all damage on item to be healed (including decay).
- <color=yellow>Fixed</color> Some prefabs accidently removed from WorldManager All Prefabs list in Commit26773
- <color=yellow>Fixed</color> issue where setting expressions in multiplayer would not revert back to a default expression when the duration was exceeded.
- <color=yellow>Fixed</color> RocketPayloads that fall through terrain will immediately be teleported back to surface.
- <color=green>Added</color> Quantity Condition can now be used to evaluate the number of items that make up a StructureNetwork when authoring helper hints.
- <color=green>Added</color> Case for PlantAnalyserCartridge in ThingPrefabCondition and NetworkCondition.
- <color=green>Added</color> new Defibrillator tool to game. Currently has similar behaviour to HealPill.
- <color=yellow>Changed</color> English.xml fixes
- <color=yellow>Fixed</color> SimpleFabricatorBase could throw error when submerged and no power cable connected.
<size=20><b>[Version 0.2.6124.26769]</b></size>
- <color=yellow>Updated</color> Tutorial4 Airlock walkthrough with respect to console no longer requiring data disk.
- <color=yellow>Fixed</color> Upgrading a single pipe or pipe utility to insulated variant deletes the contents of the pipe/tank.
- <color=yellow>Fixed</color> World Liquid Renderer could throw an index out of range exception if liquid was being rendered from the global atmosphere.
- <color=yellow>Updated</color> Wall and pipeHeater stationpedia description with operation range values for pressure and temperature.
- <color=yellow>Fixed</color> ins Ic10 instruction was parsing its arguments incorrectly. It will now correctly parse the arguments as described by the tooltip a=Value b=Position c=length.
- <color=yellow>Fixed</color> Arc Furnace was releasing gas at 0DegreesC due to the AddEnergy method not running the regression occurred following a refactor of AtmosphericEventInstance from class to readOnly struct in Sept2024.
- <color=yellow>Changed</color> StrongestContactMetaData Stack Operation back to returning Opcode plus 3 bytes. It is now authored (byte)Opcode:(byte)ShuttleType:(byte)ContactSlotIndex:(byte)Contacted. Returning the slotIdHash did not work as the total number of bytes exceeded the amount available in a double
<size=20><b>[Version 0.2.6122.26760]</b></size>
- <color=yellow>Updated</color> libRakNetDLL.so
- <color=yellow>Fixed</color> Door control, Power control and Mode Control Circuit-boards were not working with devices that had been updated to the new animation system.
<size=20><b>[Version 0.2.6121.26757]</b></size>
- <color=yellow>Fixed</color> Wall Light Long Wide could not be deconstructed when looking at the bulb with hand drill due to an incorrectly authored collider.
- <color=yellow>Changed</color> Increased the size of All_Light_Activated Dense pool.
- <color=yellow>Fixed</color> inaccuracies in Stationpedia descriptions for Portable Liquid canisters.
- <color=yellow>Fixed</color> On Vacuum worlds Medium and large trader slots could sometimes be populated with small traders. Saves experiencing this issue will find the issue resolved when current traders expire and new traders are rolled.
- <color=yellow>Fixed</color> an IndexOutOfRange Exception thrown by the AdvancedTablet that could cause a save to fail to load. Saves that experienced this error will now be able to load correctly.
<size=20><b>[Version 0.2.6120.26751]</b></size>
- <color=yellow>Changed</color> re-enabled Liquid Filtration this device is now available for testing on beta.
- <color=yellow>Reenabled</color> rocket payload bay and payload delivery container these items are now available for testing on beta.
- <color=yellow>Changed</color> StrongestContactMetaData stack instruction to work with new trader slot definitions. It now returns the following packed value OpCode(byte):slotIdHash(Int32):ShuttleType(byte):Contacted(byte)
- <color=green>Added</color> ContactSlotIdHash Logic value to MediumSatelliteDish so this value can be read via standard logic commands as well.
- <color=yellow>Fixed</color> Items moving through chute networks could sometimes have the Fallen through the world behaviour incorrectly applied, resulting in the item being teleported to the nearest safe drop position (usually on the roof).
<size=20><b>[Version 0.2.6102.26728]</b></size>
- <color=green>Added</color> missing RakNet SO file for linux
- <color=red>Removed</color> Liquid Filtration from recipe list and made it not spawnable
- <color=yellow>Changed</color> Made Payload bay objects not spawn-able for now as they require further testing on beta. They will move to stable in a patch early next year.
- <color=yellow>Fixed</color> Liquid Filtration Machine was not using power.
- <color=yellow>Missing</color> png meta files from engine upgrade.
- <color=green>Added</color> Payload Bay Large. The payload bay is placed in a rocket and allows for the attachment and deploy of a payload item. Use the new deploy action in the location panel, available at the low orbit space map node. The payload bay must be turned on and open for the deploy action to proceed.
- <color=green>Added</color> Payload Delivery Container. This allows for strategic delivery of up to 10 items via rocket. Weld up the container and attach to the rockets Payload Bay Large with a wrench. The target X and Z coordinates should be set on the Payload Bay and once deployed the container will be dropped to that exact location. A deployed Container will be trackable with the tracker cartridge.
- <color=yellow>Fixed</color> physics collision bugs or terrain collider lods not getting generated on time could cause items to fall through terrain and get destroyed. 
- <color=yellow>Changed</color> out of bounds check for items to also check if object is completely inside terrain as part of check for returning to surface.
- <color=yellow>Fixed</color> running editor validate did not clear InteractableParentIndex before re-assigning, this could result in bugged Interactables when authoring new assets.
- <color=yellow>Fixed</color> Dynamic Objects in slots would block construction.
<size=20><b>[Version 0.2.6100.26719]</b></size>
- <color=yellow>Changed</color> the name of ItemKitLiquidFiltration to be more consistent with naming conventions of other Kits. Was "Kit Liquid Filtration", changed to Kit (Liquid Filtration).
<size=20><b>[Version 0.2.6099.26717]</b></size>
- <color=green>Added</color> new LiquidFiltrationMachine. It is similar in function to the original filtration machine except it is able to handle liquids as well as gasses.
- <color=yellow>Fixed</color> an issue where an integrated circuit placed in an atmospherics device would not be set to invisible when the cover panel was closed.
- <color=green>Added</color> TakeNormalisedLiquidVolumeScaled function to AtmosphereHelper.
<size=20><b>[Version 0.2.6097.26712]</b></size>
- <color=green>Updated</color> Unity version from 2022.3.7 to 2022.3.62 - updating Unity versions always comes with a high risk and there's a lot of unknowns.
- <color=green>Added</color> new raknet and replaced all base level net code this required a minor version update of Unity to achieve. From a code point functionally there should be no change the changes in raknet may have some positive impact on multiplayer. This change will allow for us to monitor and debug network issues much easier and opens a lot of doors for us to make improvements. This commit is just a one for one swap from the old version to the new though.
- <color=red>Removed</color> RocketNet plugin
<size=20><b>[Version 0.2.6096.26709]</b></size>
- <color=yellow>Fixed</color> DynamicCanister could sometimes be unable to be removed from connector upon joining a game as a client.
- <color=yellow>Changed</color> some data types in DynamicThing.SerializeOnJoin as they were unnecessarily large.
- <color=yellow>Fixed</color> Clients not getting the correct cached WorldCenterOfMass and Position values on join.
<size=20><b>[Version 0.2.6092.26704]</b></size>
- <color=green>Added</color> second pass at multiplayer serialization refactor. Double handling was broken on last beta video, causing a large number of issues. The buffer process has been streamlined, and will be cached. The buffer will now be reused to reduce memory churn. This should reduce strain on the server, and fix some bugs players are experiencing with desync. Future change will be replace backend RakNet implementation with newer version.
<size=20><b>[Version 0.2.6091.26702]</b></size>
- <color=yellow>Fixed</color> Sometimes Portable tanks could not be disconnected from PortablesConnector.
<size=20><b>[Version 0.2.6089.26698]</b></size>
- <color=green>Added</color> first pass of new multiplayer buffer synchronization. Removed reliance on BinaryWriter and BinaryReader, as well as unnecessary Stream duplication. These were causing very significant memory garbage, that would affects servers (and hosts) who are running very big saves. It is possible that some causes of desync have been fixed also. This is a very big change and is being released to beta for more extensive testing. If confirmed working, will result in a very significant reduction in memory churn - that was identified as a cause of lockups on servers for large bases.
<size=20><b>[Version 0.2.6088.26696]</b></size>
- <color=yellow>Fixed</color> not being able to interact with Traders(and other non-Things)
<size=20><b>[Version 0.2.6087.26691]</b></size>
- <color=yellow>Fixed</color> OccupancySensor could throw Stack overthrow exception when multiple characters were in the same room.
- <color=yellow>Increased</color> the OccupancySensor Stack size to 18.
- <color=yellow>Fixed</color> dynamic Canisters not interactable when joining a save that has a large number of items.
- <color=yellow>Updated</color> glowing effect for circle mood icons 
- <color=yellow>Reduced</color> status icons size about 77%
<size=20><b>[Version 0.2.6085.26682]</b></size>
- <color=yellow>Fixed</color> Formatting on mood and hygiene tooltips.
- <color=green>Added</color> Player command for setting player stats.
- <color=green>Added</color> a rocket refuel command. This will refuel and recharge batteries for provided rocket. Only works in creative and only on the server in multiplayer. Intended use is to help players who suffer bugs or problems. Later will we adding more 'in game' ways to handle rockets in stuck states.
- <color=green>Changed</color> the body bag to be draggable by the entire thing and moved it closer to the player
- <color=yellow>Fixed</color> fertilized egg values in stationpedia were incorrect.
- <color=green>Added</color> tooltip to fertilized egg containing both incubation state as well as required incubation targets.
- <color=yellow>Fixed</color> failure to load if there is a spawned in body bag
- <color=green>Changed</color> construction kit meshes of DynamicAFrameStripes, DynamicAFrameWIP1, DynamicBarrier, DynamicChannelizer and DynamicWorkCone prefabs
<size=20><b>[Version 0.2.6084.26675]</b></size>
- <color=green>Added</color> new Status Icon for Refreshed status. When hygiene is greater than 100% the player will recieve the refreshed buff which adds a 5% increase to movement speed and 10% increase to tool speed.
- <color=green>Added</color> Detail tooltips to Refreshed and Mood Status Icons.
- <color=yellow>Fixed</color> an exception that could get thrown when an entity state was changed to dead.
- <color=yellow>Fixed</color> respawn popup displaying after already respawning
<size=20><b>[Version 0.2.6082.26670]</b></size>
- <color=green>Added</color> Detailed Tooltips for Stun, Hydration and Nutrition Status icons.
- <color=green>Added</color> replacement mesh that was more interesting for the Super-large Heat Exchanger.
- <color=green>Added</color> new Water Fountain 2x1, deprecating the old one to avoid device bloat. The new one is 2 small grids high, which makes it much better for it to align to the height of characters.
- <color=green>Added</color> Detailed tooltip to Oxygen Warning and Critical status update.
- <color=green>Added</color> Camera Update for when Player is in bodybag. This allows us to fade camera to black in this situation.
- <color=yellow>Changed</color> Organs now refer to their parent Slots Parent when determining ParentHuman, ParentEntity or ParentBodyBag. Previously these were cached independently on the organs.
- <color=yellow>Fixed</color> an edge case where LodManager could throw an exception when respawning causing the player to fail to have control of their character.
- <color=green>Added</color> TargetSlotIndex and TargetPrefabHash logic variables to Vending Machines, to indicate what is selected for logic purposes.
- <color=green>Refactored</color> Vending Machine to use UniTask instead of Coroutine, reducing garbage collection.
- <color=green>Changed</color> cryotube to heal starvation damage, as it was confusing to users that it did not.
- <color=yellow>Changed</color> shoulder pad of item HARM suit, so it can be fit on suit storages. 
- <color=yellow>Fixed</color> name of super large direct heat exchangers and added the standard description text from the other direct heat exchangers
<size=20><b>[Version 0.2.6081.26657]</b></size>
- <color=yellow>Fixed</color> failing to load game if the host player is in a body bag. Known issues: the camera effects are not being applied correctly for clients or host when loading or joining a game while in a body bag.
<size=20><b>[Version 0.2.6080.26655]</b></size>
- <color=green>Added</color> Tooltip for Respawn Stress Status Icon.
- <color=yellow>Changed</color> Increased Ore yield from all SpaceOre sites by 25%.
- <color=yellow>Fixed</color> Upnp errors would generate stacktraces, confusing the user.
- <color=yellow>Fixed</color> (beta) Super-Large liquids radiator had incorrect setting (gas to liquid) connection that prevented it from exchanging properly.
- <color=green>Added</color> new UI for respawn popups. The popups will display after 5 seconds, will give an extra confirm dialog before respawning, and encourage the being saved/revived over simply respawning
- <color=yellow>Changed</color> Refactored StatusIcon to use UITooltipCanvas. Custom tooltips for status icons are now set in StatusUpdates.Initialize() where you can pass in a ToTooltip function as part of the register method for each status update.
- <color=yellow>Fixed</color> a random debug line from being printed to the console when starting a single player game
- <color=yellow>Fixed</color> the paintable material so that the ItemKitInteriorDoors can now be painted and updated the Blueprint so that it now matches the ItemKitInteriorDoors prefab.
- <color=green>Added</color> some additional checking to make sure trader object is cleaned up when trader leaves.
<size=20><b>[Version 0.2.6077.26643]</b></size>
- <color=yellow>Fixed</color> Corner Chutes could not be repaired. Other chutes can be, so this was an oversight.
- <color=green>Added</color> third pass on days lived appearing in the multiplayer scoreboard. Now the corrent variable should be tested to collect the entity, rather than RegisteredHuman.
- <color=green>Added</color> more medical information to cryotube information panels for occupant.
- <color=yellow>Fixed</color> organs were not specifically named when showing damage in cryotube, and base damage on entity was not showing either.
- <color=green>Added</color> Starvation and dehydration warnings to cryotube to better indicate issues with players who are dying while inside the cryotube.
<size=20><b>[Version 0.2.6076.26638]</b></size>
- <color=green>Added</color> Mode state to Loader, to allow finer logic control. Auto is the default, and will automatically pack or dump anything if nothing to pack it in. Logic will require the user to control export state.
- <color=green>Added</color> FreeSlots and TotalSlots as LogicSlotTypes, to allow better control of objects when in the Loader or Unloader.
- <color=yellow>Fixed</color> second pass on clients not having DaysLived, needed to be updated in the context of the new respawn code. Now sync'd on every day change.
<size=20><b>[Version 0.2.6075.26635]</b></size>
- <color=green>Added</color> NextWeatherHash logic type, and first pass of better tooltip for weather station (not hooked up yet)
- <color=green>Added</color> second pass of wall pressure handling to offer more consistent experience of wall pressures when multiple walls present.
<size=20><b>[Version 0.2.6074.26631]</b></size>
- <color=yellow>Fixed</color> (beta) heat exchange tooltip was using incorrect unit
- <color=yellow>Fixed</color> (beta) auto sort and consolidate would consolidate stackable items that had been painted different colors. Now it will not merge stacks that are different colors.
- <color=yellow>Fixed</color> scoreboard data does not correctly list the days lived for clients or player.
- <color=red>Reverted</color> body bag changes, it will need a slightly different approach.
- <color=green>Added</color> some additional tooltips for food to indicate better some decay state changes.
- <color=green>Added</color> some additional tooltips for food to indicate better some decay state changes.
- <color=yellow>Fixed</color> (beta) blueprint for burger box was incorrect
- <color=yellow>Fixed</color> (beta) trade order for burgers included fries request inside the box.
- <color=green>Added</color> can eat food out of burger box directly if opened
- <color=green>Added</color> Burger Box will reduce the decay rate of contained burgers.
- <color=green>Added</color> better tooltips to Direct Heat Exchanger to help users assess how they work when encountering them for the first time.
- <color=green>Added</color> body bag is now interactable anywhere on it, rather than the handle. this should make using it much easier.
- <color=yellow>Moved</color> Atmosphere life handling and cleanup onto the gametick thread. It was causing a lag spike every second on the server for worlds with more than 5000 atmospheres.
- <color=yellow>Changed</color> Server now flags atmospherics data as ready to send as soon as the atmos tick is done rather than waiting until the start of the next tick.
- <color=yellow>FixedSetting</color> the Sound Volume on SuitBase could cause fragment handler to throw an exception, halting further reading of the network update. The update volume function has been moved to an async unitask to avoid this.
<size=20><b>[Version 0.2.6073.26623]</b></size>
- <color=green>Adjusted</color> distant rocket location for Janus, as was some misalignment with other distant ore values. Now distant spacemap markets on vulkan will have a slight buff, given their relative distance.
- <color=yellow>Fixed</color> (beta) Super-Large Direct Heat exchanger lost its connection settings meaning it would not properly access connected networks.
<size=20><b>[Version 0.2.6071.26619]</b></size>
- <color=green>Added</color> Burger Box item. Allows placing a burger inside it. Now some traders will buy burgers. To be expanded on later when we allow support for trader visitors.
- <color=green>Updated</color> fries model and texture.
- <color=yellow>Fixed</color> (beta) sort button would not show for backpacks and items when in hands, or other fixed slots. This was because the button visual state was only appearing on assign. Now it is updated when changes occur.
- <color=yellow>Added</color> Large Direct Heat exchanger kits can now be stacked, as was needed for the Super-Large variant.
- <color=yellow>Fixed</color> WindTurbines were Calculating the wind Direction and strength multiple times per frame for each wind turbine. These are now calculated once per frame globally.
- <color=yellow>Moved</color> some wind turbine calculations into threaded update.
<size=20><b>[Version 0.2.6070.26612]</b></size>
- <color=yellow>Fixed</color> Error spam that could occur when 1st opening Rocket canvas on location panel.
- <color=yellow>Fixed</color> saving broken when a body bag is serialized with bad/null data
- <color=green>Changed</color> stack trace colour to be grey when printing it to the console.
<size=20><b>[Version 0.2.6069.26609]</b></size>
- <color=yellow>Fixed</color> (beta) super large direct heat exchangers construction quantities were not changed.
- <color=green>Added</color> new blueprints to the super-large direct heat exchangers.
- <color=yellow>Fixed</color> direct heat exchangers were not using standardized tooltips to display energy transfer.
- <color=yellow>Fixed</color> (beta) names for the new super large variants did not match previous naming conventions.
- <color=green>Added</color> Super Large variants of all the direct heat exchangers, with optimized meshes. These are intended to be used instead of placing three heat exchangers, to help reduce part count. They all use a common mesh and sub-components, so they will all batch together as will their sub-components.
- <color=yellow>Fixed</color> Dynamic body bag running serialization logic on launch and causing errors that would leave to saves not being able to be loaded.
- <color=yellow>Fixed</color> missing english.xml entry for body bag
<size=20><b>[Version 0.2.6068.26602]</b></size>
- <color=yellow>Fixed</color> Infinite Wind in elevator grid that could happen when placing an elevator shaft as a client.
- <color=yellow>Fixed</color> When placing an elevator shaft a grid of World atmosphere could get spawned inside the placed shaft.
- <color=yellow>Fixed</color> (beta) new gas sensor mesh was mistakenly not included.
- <color=green>Added</color> a mesh, textures and material for burger box
<size=20><b>[Version 0.2.6067.26597]</b></size>
- <color=green>Added</color> decay to body bag. When players die they will now decay after one minute into a body bag object and their belongings will move to a large cardboard box. As long as the player has not respawned you will be able to take the body bag and revive them by placing the body bag into a cryotube. This is a first pass and some follow-up supporting features will be added to round out the feature and provide more information to the player. Body bags can be cleaned up using the angle grinder tool and the tooltip will let you know if someone can be revived.
- <color=yellow>Changed</color> several null checks to explicit life time checks as they were the suspected cause of several Audio related Null Reference Exceptions.
<size=20><b>[Version 0.2.6066.26594]</b></size>
- <color=yellow>Fixed</color> gas sensor material was an old obsolete one, that was not performant and did not allow painting. Gas sensors can now be painted.
- <color=yellow>Fixed</color> cryo and sleepers had inconsistent thermodynamic transfer values. Now both are unified, they are very well insulated but not entirely so.
<size=20><b>[Version 0.2.6065.26590]</b></size>
- <color=yellow>Fixed</color> Cable Fuse 500kW did not have string name.
- <color=green>Added</color> can repair large battery, rebalanced repair of smaller station battery in line with this change as well.
- <color=yellow>Fixed</color> wall structures would apply pressure delta for each wall, rather than additive pressure delta. This meant a weak wall with a solid wall, the weak wall would still break regardless of whether the "face" overall was secure. Now the pressure delta is the additive max pressure delta. All structures on a face (so, each wall either side of a face) will count together.
<size=20><b>[Version 0.2.6064.26587]</b></size>
- <color=yellow>Refactored</color> Rocket UI, to make the state closely coupled to the Motherboard state. The function that builds the Rocket references for the motherboard is now server authoritative rather than relying on ab assumed client side deterministic behaviour. Previously a number of abstractions could potentially cause the state shown in the UI to be mismatched to the state of the rocket simulation. This is suspected to be the cause of several anomalous rocket behaviours when controlling two or more rockets from the same computer when playing as a client. 
- <color=yellow>Fixed</color> an issue where Deconstructing a Frame or building or deconstructing an elevator could cause a tile of world atmosphere to be spawned.
<size=20><b>[Version 0.2.6063.26584]</b></size>
- <color=yellow>Fixed</color> composite shutter controller rotation options were not aligned with all the other composite shutter pieces, limiting them to be used only in certain orientations for no good reason.
- <color=yellow>Fixed</color> VolumePump throws audio error when deconstructed when turned on.
<size=20><b>[Version 0.2.6062.26579]</b></size>
- <color=green>Updated</color> waste tank critical warning from 100% to 95%
<size=20><b>[Version 0.2.6061.26577]</b></size>
- <color=yellow>Fixed</color> Collider of growlight was not centered, it now lights an equal amount in each axis.
<size=20><b>[Version 0.2.6060.26574]</b></size>
- <color=yellow>Fixed</color> Clients could sometimes get stuck on the processing trade screen.
- <color=yellow>Fixed</color> Clients trading panel would sometimes not update after a trade was processed.
- <color=green>Added</color> VolumeOfLiquid logic value to Gas Sensor.
- <color=green>Added</color> tooltip to microwave indicating that it can't operate without door closed to help new players.
- <color=green>Fixed</color> items can become damaged on lava worlds when split or swapped between slots. This was because of how the server or game creates items, and they can be temporarily at a position that takes damage. There may be other use cases that need to be trapped and fixed.
- <color=yellow>Changed</color> Reduced DeepMinable profile yields to be more inline with the ore yields of the space-map.
- <color=yellow>Fixed</color> Food and consumables Utility traders could often get created with items out of stock.
- <color=yellow>Fixed</color> if Bulk multiplier would cause a trader inventory item to generate as less than 1 it will be clamped to 1.
- <color=green>Added</color> WIP commit for Rocket payload bay.
- <color=yellow>Changed</color> Several rocket motherboard server messages to reference the target avionics rather than target rocket to match the serverside behaviour.
- <color=yellow>Changed</color> Rocket UI now updates every frame.
- <color=yellow>Moved</color> Rocket UI update logic off rocket MotherBoard and into RocketCanvas class.
<size=20><b>[Version 0.2.6058.26565]</b></size>
- <color=green>Added</color> console displays no longer have a data disk slot to set configuration. This has long been confusing, and results in more complex objects, synchronization, and geometry. Now the consoles have a screw like logic devices that, when used with a screwdriver, will toggle between configuration and operating mode.
- <color=green>Optimized</color> console meshes to reduce material count and vertex attribute complexity.
- <color=yellow>Fixed</color> error on client connecting caused by incorrect order of network messages in message factor
<size=20><b>[Version 0.2.6057.26562]</b></size>
- <color=green>Added</color> tooltip to fuselage kit. This will let players know that they can replace rocket fuselage pieces while holding an Angle Grinder in their hands.
- <color=yellow>Fixed</color> (beta) slot consolidation button would throw contents onto the floor and incorrectly mix stacks. Now an entirely new system replaces the old one. A special network message is sent from clients, and reconciliation happens on the server, being distributed to clients.
- <color=green>Added</color> 500kW Fuse. This is on the existing cable fuse kit. This is useful with the new super heavy cables.
- <color=green>Added</color> LED Console displays will orient their displays to always be up. This means if you place an LED display inverted, the LED display itself will be oriented updates. This makes it more consistent with how the wider displays are setup.
- <color=yellow>Fixed</color> Updating the power setting on the SatelliteDish would not reTrigger a refresh of resolve times.
<size=20><b>[Version 0.2.6055.26554]</b></size>
- <color=yellow>Fixed</color> AirConditioner Heating amount tooltip was backwards (said heating when it should have said cooling)
- <color=yellow>Fixed</color> 1 grid hanger doors could be destroyed by fire.
<size=20><b>[Version 0.2.6053.26550]</b></size>
- <color=red>Reverted</color> change to find Launch pad function (rev26515). It appears the code was necessary.
<size=20><b>[Version 0.2.6052.26548]</b></size>
- <color=yellow>Fixed</color> Manual floor hatch buildstate0 invisible (beta only)
<size=20><b>[Version 0.2.6051.26546]</b></size>
- <color=green>Refined</color> the sort button on inventory windows. It will now sort by class, name, and then quantity.
- <color=yellow>Fixed</color> cardboard boxes could not be interacted with the 'drag all' and 'drag all of type' combos, and would also not work with the new sort button.
- <color=green>Added</color> a 'sort' button to inventory windows. This button will sort all items, alphabetically primarily and secondarily by quantity. This will also consolidate any stackable items, such as ores. Dedicated slots will be ignored (such as canister, battery, etc...). The only exception to this is ore slots.
- <color=green>Added</color> tooltips to inventory window buttons so that people know what they do.
- <color=yellow>Fixed</color> the smoothing groups for the ruptured insulated pipe variants
- <color=yellow>Fixed</color> Credit Cards not merge-able on clients.
- <color=yellow>Updated</color> dynamic body bag mesh, blueprint and thumbnails.
<size=20><b>[Version 0.2.6050.26539]</b></size>
- <color=yellow>Fixed</color> incorrect paintable material would cause exception for joining clients. Now gracefully handled.
- <color=green>Fixed</color> Server was running UI only code unnecessarily for slots.
- <color=yellow>Fixed</color> null ref on joining a game caused by liquid regulator paintable material was set to the wrong colorblue material.
- <color=green>Added</color> better error logging for fatal serialize on join bugs to help debug issues when joining games.
- <color=yellow>Added</color> build tool for editor to automate switching build configurations and building dedi and client. Accessible through Stationeers -> Builds.
<size=20><b>[Version 0.2.6049.26532]</b></size>
- <color=yellow>Changed</color> made DraggableThings opt out of client side physics optimisation as I believe this is a cause of a recent issue where tanks were unable to be wrenched out of portables connectors.
- <color=yellow>Fixed</color> Kit Liquid Regulator not having paintable material set
- <color=yellow>Fixed</color> Rocket Fuselage merge not working on client.
- <color=yellow>Moved</color> GetWorldData() in SaveHelper.cs behind a try catch.
<size=20><b>[Version 0.2.6047.26525]</b></size>
- <color=yellow>Fixed</color> (beta) burger recipe missing from automated oven.
- <color=yellow>Fixed</color> (beta) hard crash when looking at fuel slot in solid fuel generator.
<size=20><b>[Version 0.2.6046.26522]</b></size>
- <color=green>Fixed</color> (beta) missing burger mesh and thumbnails.
- <color=yellow>Minor</color> (beta) change to how fuel slot tooltips show power.
- <color=green>Added</color> fuel ore or ingots in a fuel slot will report the power they will provide.
- <color=yellow>Fixed</color> CryoTube would drop a mask when it was deconstructed.
- <color=green>Added</color> Burger high tier food item. Made from cheese, tomato, and other ingredients. Can be eaten slightly faster than cake.
- <color=yellow>Fixed</color> (beta) coolant tank was mislabled as Battery in suit storage.
- <color=yellow>Fixed</color> Janus Image was obscuring other locations when scanned in spacemap.
- <color=yellow>Fixed</color> (Beta) Cheese reagent did not have localized srtring.
- <color=yellow>Changed</color> FindLaunchPad function for rocket now only runs when rocketfuselage pieces are placed. Its possible this function was causing some aberrant behavoiur around snapping rockets to launch mounts. 
- <color=yellow>Fixed</color> Janus Image was obscuring other locations when scanned in spacemap.
<size=20><b>[Version 0.2.6045.26512]</b></size>
- <color=green>Added</color> better tooltip to shower handle. Now will tell you whether or not you can be cleaned, such as letting you know if clothing items prevent hygiene change.
- <color=yellow>Added</color> automatically added prefab changes to manufacturing machines due to added cheese reagent.
- <color=green>Added</color> ability to repair chutes using welder and steel sheets.
- <color=yellow>Fixed</color> game would not start due to new cheese reagent missing in a few places.
- <color=yellow>Fixed</color> duplicate prefabs in world manager prefab list.
- <color=green>Added</color> Cheese Wedge item to be used in cooking recipes, includes reagent type for cheese.
- <color=green>Added</color> headlamp and battery powered helmets will show its battery state when in suit storage.
- <color=green>Added</color> jetpacks will show their propellant state when in suit storage.
- <color=green>Added</color> HARM Suits will show their coolant tank state when in suit storage.
- <color=green>Added</color> stack quantity to Rocket IC housing, as this was set to one only which we typically do for fuselages.
<size=20><b>[Version 0.2.6042.26499]</b></size>
- <color=yellow>Fixed</color> Clients can't eat (beta only introduced rev26496).
<size=20><b>[Version 0.2.6041.26497]</b></size>
- <color=yellow>Fixed</color> a number of edge cases where rockets could explode from collision due to an overly aggressive collision detection system that was detecting structures that were actually clear of the rocket.
- <color=green>Added</color> respawn stress. Respawn stress will last for about a day after respawning(easy half a day, normal a day, Staitoneer two days) and affect reduce your water and food consumption speeds, tool use speed, as well as give you a penalty on trades with traders(tooltips and more UI coming to make this clear).
- <color=green>Added</color> Hygiene Tool speed and Mood movement speed multipliers to the difficulty settings xml file, previously hard coded
- <color=green>Added</color> new respawn conditions: you will now respawn with an emergency suit on Stationeers difficulty
- <color=green>Added</color> respawning now brings you down in a new capsule pod
- <color=green>Updated</color> the day counter by your avatar camera to display the number of days your character has lived instead of how many days the server has been up.
- <color=yellow>Fixed</color> chickens not decaying (beta only).
- <color=yellow>Removed</color> some complexity around setting human decay time. Human decay is currently still disabled but when it is reenabled the time will be a simple const value.
- <color=yellow>Removed</color> unnecessary recursive caching of all rig transfoms on human awake as the cached list was not being used anywhere.
- <color=yellow>Added</color> null check on brain in entity state condition (sometimes world objectives could throw null ref exceptions when being evaluated).
- <color=green>Added</color> Heating/Cooling amount to AC tooltip.
- <color=yellow>Changed</color> Shower can now increase Hygiene to 150%.
- <color=yellow>Changed</color> When Hygiene is over 100% Character has 5% movement speed buff and 10% toolSpeed buff. (status icon to follow shortly)
- <color=yellow>Changed</color> Heal pill no longer fully heals player. The CryoTube must be used to heal back to full health. 
- <color=yellow>Fixed</color> CondensationChamber & EvaporationChamber tooltip to use correct formattingh.
- <color=yellow>Fixed</color> Weather station turbine spins in solar storm.
- <color=yellow>Fixed</color> Wind turbines had increased output during solar storm.
- <color=yellow>Fixed</color> WeatherStation wind turbine now only spins on planets with atmosphere.
- <color=green>Added</color> Large Wind Turbines now rotate to point into the wind.
<size=20><b>[Version 0.2.6039.26484]</b></size>
- <color=yellow>Fixed</color> Lod flares getting occluded by cursor voxel collider. (they would only show when you were jetpacking or when you jumped.
- <color=yellow>Reverted</color> rev.26481 and rev.26476 for now due to a few bugs with player cosmetics.
- <color=yellow>Fixed</color> players re-lifed in cryo did not have their name set correctly.
- <color=yellow>Fixed</color> players re-lifed in cryo were not sending their positions correctly to the server.
<size=20><b>[Version 0.2.6038.26478]</b></size>
- <color=red>Removed</color> Random direction offset that was applied to SatelliteDish contacts. Two dishes that were pointed in the same direction would report different values distance to contact values. While, the original intent was to make the resolving process more fuzzy we feel like this extra level of data obfuscation does not fit in well with the rest of the games approach to readable logic values (i.e in every other system, the values you read are exact and reliable).
- <color=yellow>Fixed</color> the Landingpad_2x2CenterPiece01 so that it is now hidden in the stationpedia as it is not implemented yet.
- <color=yellow>Added</color> first pass on re-lifing players by putting their body bag into a cryo tube. Using the body bag on an open cryo tube will insert the player body and destroy the body bag (wip).
<size=20><b>[Version 0.2.6037.26474]</b></size>
- <color=yellow>Potential</color> fix for locker slots sometimes not being interactable when joining a server.
- <color=yellow>Changed</color> Default zip compression level for save games from 9 to 5. This should help reduce the amount of time saving as the zip step was taking a long time.
- <color=green>Added</color> Rocket Fuselage pieces can now be swapped out with different variants without deconstructing the rocket.
- <color=yellow>Fixed</color> Cosmetic Rocket Fuselage variants were not visible in Stationpedia.
<size=20><b>[Version 0.2.6036.26470]</b></size>
- <color=yellow>Changed</color> channel settings of Locker sound.
- <color=yellow>Fixed</color> Lockers were in an incorrect state when starting Tutorial 1
- <color=red>Removed</color> Animators from Powered Benches
- <color=red>Removed</color> Animator from FlashingLight.
- <color=yellow>Fixed</color> poking out bottom part from wall piece problem of hydroponics tray
- <color=yellow>Fixed</color> UVs and materials for HARM suit light and status light
- <color=red>Removed</color> Animators from drills.
- <color=yellow>Changed</color> LiquidCanister to use AnimComponent.
