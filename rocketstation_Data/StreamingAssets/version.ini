- <color=green>Added</color> adaptive multiplayer tick rate that slows the global state-send from 20Hz down toward 5Hz as a clients outgoing send backlog grows (sheds volume via delta coalescing instead of pausing), restoring full rate as it drains and kicking any client whose backlog exceeds the hard limit so one struggling connection can't stall the server. This may be a major fix for clients who experience sudden desync, with the likely cause identified as SENDQ spiraling once the client experiences a slowdown, and is unable to recover due to getting bombarded with new messages.
