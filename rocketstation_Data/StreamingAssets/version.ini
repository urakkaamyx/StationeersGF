<size=20><b>[Version 0.2.6286.27160]</b></size>
- <color=green>Added</color> new console formatting and updated help text. The intention is to make the console more usable and the help text be more consistent.
<size=20><b>[Version 0.2.6280.27153]</b></size>
- <color=green>Added</color> cinematic camera controller. Run 'camera cinematic' in the console to toggle (or Esc to exit). Free-fly with
<size=20><b>[Version 0.2.6274.27143]</b></size>
- <color=red>Reverted</color> commit 27135 which broke structure placement
<size=20><b>[Version 0.2.6269.27138]</b></size>
- <color=green>Optimized</color> MixInWorld, add GasMixture.RemoveInto to fuse Remove+Add, move LiquidSolver.QueueSpawns onto workers via ConcurrentQueue, and swap _mixingAtmos to a fixed array for ref mutation. In RunInternalReactionsJobs, collapse the redundant double-pass ForEach and stop recomputing immutable WorldPosition every tick.
- <color=green>Optimized</color> AtmosphericsNetworksTick. Now fully parallelized with a new NetworkTick job stage. In the test scenario it took the tick cost from 44ms (avg) to 4ms (avg). One caution area could be DamageState.Damage race condition, although have not been able to replicate this as causing a problem. This may be able to occur for a single structure that has two atmospheric networks.
- <color=green>Optimization</color> of Atmosphere Mixing. Cache GetGasVolume in hot path. Hoisted TakeWeight and computed before loop.
- <color=green>Refactor</color> of Grid3 usage. Many more instances are now moved to WorldGrid. This will give likely no performance benefit, but hardens the code. Instances where we want a grid cell are now forced, there is no way for a degenerate coordinate to be provided.
- <color=green>Replaced</color> AsPooledSpan with an Active enumerator. This does not allocate and uses the stack instead. Much cleaner and possibly faster.
- <color=green>Refactored</color> AllPipeNetworks to be a DensePool instead of a list. This reduces garbage collection and list generation, especially for significant pipe network changes such as editing a very big pipe network or especially during explosions.
- <color=green>Remove</color> exception thrown for StructureArray. Unnecessary, as exception would be thrown anyway. Hot path so may have an appreciable difference for extremely large atmosphere mixing situations.
<size=20><b>[Version 0.2.6267.27130]</b></size>
- <color=green>Refactor</color> of Structural dictionary on Cell. Now replaced with StructuralArray with lower lookup cost and reduced garbage collection. This reduces costs associated with major structure change events, including Rocket land/depart and explosions. Outside of this will unlikely be any significant change, other than hardening for errors. Now it is impossible for a structure to be incorrectly registered on a cell.
- <color=yellow>Fixed</color> possible bug with water solver ceiling and floor was flipped.
- <color=green>Set</color> reuseCollisionCallbacks to true so collision references are reused
- <color=green>Hoisted</color> Span for GetOpenAirNeighbors outside of function. This will give an extremely modest improvement (~1-5%) for large atmosphere bases.
- <color=green>Added</color> some early exits when checking volumes of gas with 0 Quantity as well as an early exit when checking the global liquid level check
<size=20><b>[Version 0.2.6266.27125]</b></size>
- <color=yellow>Fixed</color> IsSceneLoaded was looping through every call. Now the call is cached.
<size=20><b>[Version 0.2.6265.27123]</b></size>
- <color=green>Refactor</color> of GetStepUpHeight. Was generating significant GC churn. Switched ContactPoint to be a stackalloc buffer to avoid the allocation. Buffer is then refined over time and disposed at end of scope. This would have had significant compounding effects the more characters in the game, and was called every physics tick.
- <color=yellow>Fixed</color> (beta) serious regression that did not allow pipes to connect with anything that is not a pipe.
- <color=green>Refactored</color> WillPressureDamage to be ScanStructuresAndEvaluate to provide one traversal of StructureList for PipeNetworks. The old flow saw several traversals, now it is done in one shot. Hoisted various invariants per network one per tick, and also some per structure. The inner grid loop now uses indexed access with a cached grids.Count, rather than repeated MaxPressure & StressedRatio reads per grid. End result was significant performance improvement for atmos tick in extreme (many Networks) test case, from 230ms to 170ms.
- <color=green>Added</color> GetWeakestMemberfast path. When the tick scan has already run the two calls in EvaluateIncorrectMatterState return the precomputed weakest in o(1) instead of doing a whole rescan. Legacy code left for UI debugging, as it will need this.
- <color=green>Added</color> custom GetHashCode override for WorldGrid and some compiler hints for aggressive inlining.
<size=20><b>[Version 0.2.6264.27118]</b></size>
- <color=yellow>Fixed</color> (beta) regression where cable networks would not merge correctly. The old pattern passed a List into the Queue. While refactoring, I mistook this and passed in the *count*. This meant the Queue was never populated. Now the queue is populated with the buffer objects.
- <color=green>Cleanup</color> of Connection handling for FillConnected. Now pipes handle different pipe connection types inside of their valid connection handling, to give consistent output.
- <color=yellow>Fixed</color> (beta) connection errors due to lack of Index causing red text and failure to load some saves. Now instead of index, equality is checked using grid and role values.
<size=20><b>[Version 0.2.6263.27116]</b></size>
- <color=green>Refactored</color> WillJoinNetwork to use a ConnectionRef buffer rather than generating lists. Appears to only be used when showing cursor so performance impact is minimal if any. Benefit is instead code consistency.
<size=20><b>[Version 0.2.6262.27114]</b></size>
- <color=green>Fixed</color> room flood fill ClosedList never being cleared, causing accumulation across fills
- <color=red>Removed</color> heap List<Grid3> _openNeighbours from RoomFloodFiller that also accumulated across iterations
- <color=green>Replaced</color> Thread.Sleep(1) polling with CountdownEvent kernel signaling. Windows sleeps for ~15ms minimum regardless of requested duration
- <color=green>Cached</color> ReadonlyGlobalAtmosphere in IsCloseToGlobal to avoid multiple lookups
- <color=green>Skip</color> doing all the liquid mixing logic in mix in world if there is no liquid
- <color=green>Removed</color> per-call List allocation in AtmosphericsNetwork.GetWeakestMember
- <color=yellow>Fixed</color> unprotected iteration of StructureList in AtmosphericsNetwork.Stressed setter
- <color=green>Added</color> roomevaluator console command with per-tick diagnostic stats (queue depth, fills, iterations, timing)
- <color=green>Major</color> refactor of ReferenceId. We were experiencing an explosion in ReferenceId values as they always iterated. Switched the registry from Dictionary<long, IReferencable> to a flat 1M-slot array with a fallback dictionary for overflow, giving O(1) array-index Find() on the hot path. Load now remaps remappable objects (atmospheres, networks, non-device/item things) to fresh dense ids starting at 1 via a LoadAliasMap, while Device and Item keep their saved ids for IC10 script stability. Deregistered array-range ids are pushed onto a FreeIds stack and reused by RegisterNew, so the dense range stays populated instead of NextReferenceId climbing past MAX_REFERENCES over long sessions.
- <color=green>Refactor</color> forth pass of Connected methods. ConnectedDevices has now been fully migrated to use FillConnected<Device> buffer with no GC and faster. This will reduce GC churn and be faster for networks that have large amounts of devices and cables present.
<size=20><b>[Version 0.2.6261.27110]</b></size>
- <color=green>Refactor</color> third pass of SmallGrid Connected and variant methods. Included Pipe, Chutes, Bins, and Devices. Removed duplicate methods returning WillJoinNetwork, as these were either exactly or functionally identical to the parent method.
- <color=green>Refactor</color> second pass of SmallGrid and Cable. Deprecated Connected() and began replacing with new buffer method. Cable seemed to simply reapply the parent method, so consolidated to one on SmallGrid.
- <color=green>Refactored</color> Connected handling for cables. Previously ConnectedCables on a SmallGrid object would return a list. Now a Generic FillConnected<T> uses a stackalloc buffer system. This reduces GC and is faster. A buffer of references is prepared, and then used down-chain. This will improve network handling for changes on very large cable networks. A series of changes for this and other networks together will reduce GC churn and improve FPS for very large bases and networks.
<size=20><b>[Version 0.2.6260.27106]</b></size>
- <color=yellow>Fixed</color> compile error caused by missing interface on robotic arm rail
- <color=green>Added</color> Missing Grid3Buffer
- <color=green>Refactored</color> Atmosphere Dictionary to be a ConcurrentDictionary. This may be more performant for high-intensity atmospheric situations with lots of atmospheres where contention locking could occur. On lighter loads it is possibly very very slightly less performant or the same, however at that point the game will be running so well that the loss would not be noticed.
- <color=green>Refactored</color> OpenNeighbors and ClosedNeighbors handling in GetOpenAirNeighbors. Atmosphere neighbor lists were backed by List<Grid3> fields and a  per-tick ToArray() allocation in GetOpenAirNeighbors. At 10k atmospheres this produced significant per-tick heap churn and ~4-5 MB of steady-state list overhead. DEV NOTE: CopyFrom writes data and count non-atomically; cross-thread readers (e.g. CheckStressOnStructuresClient, particle cull) can see a brief torn view. Matches the previous unlocked-read behavior in those paths, so not new behavior. Can be closed later inside Grid3Buffer via internal double-buffering without changing callers.
- <color=green>Added</color> Grid3Buffer sealed wrapper around a fixed-capacity Grid3[] plus a Count, with Span<Grid3>/ReadOnlySpan<Grid3> implicit conversions (sliced to Count), Contains, CopyFrom, and duck-typed GetEnumerator. Callers get indexer/foreach/Count semantics without needing to track a separate count field.
- <color=green>Refactored</color> some methods related to GridController that returned and used Grid3 lists. Now these are using Span buffers that are initialized on the stack. This reduces garbage collection and is faster. This may improve performance for large bases.
- <color=green>Refactored</color> LightManager use of lists. Now stackalloc is used for grid assessment. This improves performance for bases with lots of items and objects that use HasSunlight. This will reduce memory garbage collection and also be faster.
- <color=green>Extended</color> densepool functionality to allow a stackalloc usable reference system. Not immediately used as there may not be good use cases for it.
- <color=green>Refactored</color> WeatherManager to ensure capacity is set, to avoid reallocation for lists during generation of storm curtain. Investigated stackalloc use, but not enough memory would be available as this can get large.
