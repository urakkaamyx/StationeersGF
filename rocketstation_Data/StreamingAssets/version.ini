<size=20><b>[Version 0.2.6405.27695]</b></size>
- <color=green>Major</color> refactor of network architecture. Split out a Dedicated physics stream and delta gating. Previously all multiplayer traffic shared a single reliable, ordered channel. Every tick the whole world delta had to arrive in full, in order, so one late packet on a slow connection stalled everything behind it while the server queued ever-staler data it was still obliged to deliver, producing the thirty-second-action death spiral on large saves. Physics now travels on its own sequenced stream as disposable batches where newer data simply replaces older (with wake and rest poses sent reliably so nothing drifts), unchanged bodies are suppressed to a phased heartbeat, pipe/chute/cable network values are only sent when they change, and new diagnostics (network sections, network awake, a Streams debug tab) show exactly where every byte of a tick goes. On a 50k-object save this cut the per-tick state payload from 19.5KB to 1.0KB, physics from 25.5KB to 3.6KB, and client bandwidth from ~650KB/s to under 100KB/s while becoming more tolerant of packet loss, and it clears the path for per-client rate adaptation next. This change is very experimental and will be rolled back for rework if issues arise.
