<size=20><b>[Version 0.2.6341.27371]</b></size>
- <color=green>Added</color> IC Chips will now show relevant errors in their inventory tooltip. They will show execution errors when being executed by something like the Advanced Tablet, the Survival Belt, or a Hardsuit. They will show compile errors as well, but will also show compile errors when inside the laptop. Inside the laptop execution doesn't happen, so execution related exceptions won't be shown. These errors are parented up to the device they are in (such as the suit, belt, or tablet), and will show on their tooltip. This should help a lot with debugging errors related to item IC.
- <color=green>Added</color> Survival belt can now play sounds and is a transmission received, bringing it into line with the Advanced Tablet.
