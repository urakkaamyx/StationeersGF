- <color=green>Added</color> some foods can give water into stomachs, which will then be passed as polluted water.
- <color=green>Added</color> Waste Bags. These stack initially, but once beginning to be filled can continue to be filled. These are useful for temporary relief of sanitation needs while bases are being established. They are added to the survival crate and the capsule lander. Their contents is not recoverable.
