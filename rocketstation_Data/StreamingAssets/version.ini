<size=20><b>[Version 0.2.6378.27564]</b></size>
- <color=yellow>Fixed</color> (beta) proxy mesh snapped to WorldGrid resulting in objects like walls being mis-aligned.
- <color=yellow>Fixed</color> (BREAKING) Loader in "logic" mode was broken. It read the "Open" state, but only partially exported. This meant logic control had to be alternating to "Auto" to export. This is a slight breaking change. Now in "Logic" mode it functions the same as a Door in Logic Mode. In logic mode, the loader will do no export. The Open lever will do nothing. It is up to the user to read the state of Open and they can choose to do something different. There is now a "Dispense" logic type, when this is set to 1 the loader will do a full export, that is move the recipient slot occupant to the export slot, and process a full export.
- <color=yellow>Fixed</color> NRE in Rocket.GetGravity(). CurrentTransit being null was not handled.
