- <color=yellow>Modified</color> Third Person Cam to have greater zoom range and finer increments in the zoom.
- <color=yellow>Fixed</color> and optimized LED displays. These were using a pooled mesh system, however this pooling meant the meshes were never culled by the occlusion system. So they would continue to draw at massive distances. This system has been replaced with a batched rendering system reducing both general bloat as well as being more performant and less error prone.
- <color=yellow>Darkened</color> distant structure proxies to 70% brightness as a temporary change and tidied OcclusionManager formatting.
- <color=yellow>Fixed</color> crew module interior atmosphere duplicating during landing. IsInCrewModule now keeps the cabin sealed through Launching/Landing, so it no longer falls back to a world atmosphere and registers a duplicate at the cabin grid that then sits locked alongside the interior.
- <color=red>Reverted</color> the crew module InternalAtmosphere client failsafe (r27573); it didn't fix the underlying issue, which reproduces in singleplayer and is now addressed at the source.
