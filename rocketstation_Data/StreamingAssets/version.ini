<size=20><b>[Version 0.2.6392.27636]</b></size>
- <color=green>Major</color> non-breaking refactor of Rocket part handling. Rocket interiors now have a persistent identity instead of being rediscovered by world position every refresh.  Each rocket part records, once, the network it belongs to and its offset from the engine-fuselage anchor. Membership and on-load placement are driven by that record, not by what currently sits on the hulls cells. The old path rebuilt a networks Internals every refresh by scanning the hulls occupied cells and grabbing whatever was there. Any moment a part wasn't on those cells it was silently dropped or swept into the wrong network. On placement (or restored from its record on load for backcompat) a part resolves its rocket once and stores { network, offset }. RegenerateCollections is now add-only: it adopts untracked parts sitting on the hull cells, refuses any part already owned by another live network (no cross-absorb), and never drops a tracked part. The record (network id + offset) is serialized to StructureSaveData; on load each part is placed at anchor.position + offset, so the whole rocket reassembles relative to its anchor wherever it is. This should solve major and serious issues with Rocket disembowelment and decoupling of parts.
