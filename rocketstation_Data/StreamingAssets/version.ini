- <color=green>Added</color> a 'relink' parameter to the 'rocket' command. This will attempt to repair a rocket that has encountered a rare bug, where the rockets fuselages move, but its components all stay in another location. This command finds the matching interior contents that should be in the fuselages, and moves the disemboweled contents back inside the fuselage. Should *not* be run with connected clients. A save/load cycle should be run after using. The rare bug causing rockets to become disemboweled will be fixed in another commit.
