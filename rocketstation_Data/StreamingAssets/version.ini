- <color=yellow>Removed</color> unused ping system.
- <color=yellow>Fixed</color> issue where ItemKitLargeDirectHeatExchanger was unable to be split into separate stacks by the user.
- <color=yellow>Fixed</color> issue where station batteries would sometimes not lose power in cold atmospheres. This was because the atmosphere it was trying to get could return as null so it exited before it could remove the power.
<size=20><b>[Version 0.2.6138.26830]</b></size>
- <color=yellow>Fixed</color> A long standing issue where atmosphere direction was not being applied to existing atmospheres on clients. This would result in clients not seeing air particle effects when inside rooms, wind sounds not playing in some grids (or wind sounds getting stuck on) and the character not being moved correctly by wind forces when in rooms. Big thanks to @FlorpyDorp from our modding community for finding the fix to this issue!
- <color=yellow>Fixed</color> Failed to load game due to error from RocketCargo OnChildEnterInventory (beta only)
- <color=yellow>Removed</color> unnecessary calls to InputMouse.SetMouseControl. This is now handled in the same place as SetCursor. Stationpedia should now correctly lock movement when the search field is focused rather than being unlocked when you delete or flip back and forth when typing. Removed delayed SetMouseControl on application focus, instead MouseModeController will be flagged to re-set cursor state on the next tick.
<size=20><b>[Version 0.2.6137.26827]</b></size>
- <color=red>Removed</color> unused research panel and a few related prefabs with missing scripts. Removed research manager as it had already been removed from gamemanager's manager list.
- <color=yellow>Fixed</color> issue where StructureMediumTransfomer(Reversed) would not show up in Stationpedia.
- <color=yellow>Fixed</color> long standing issue where mouse could become incorrectly unlocked when interacting with traders and other ui panels. Now things that affect cursor locked state will all be tracked in one place and all open uis will be tracked to fix the issue of closing one popup locking the mouse. Have removed all previous calls to CursorManager.SetCursor and simplified a bunch of logic in InventoryManager.
- <color=yellow>Fixed</color> Chute import/export bins using incorrect hazard material.
- <color=yellow>Fixed</color> Overflow_NegateTwosCompNum Exception that could prevent saves from loading if it had an object that was so far out of bounds as to overflow an integer value.
- <color=green>Added</color> C# classes for CombustionDeepMiner.
- <color=yellow>Changed</color> Moved shared behaviour of CombustionCentrifuge and CombustionDeepMiner into helper class InternalCombustion.cs
- <color=yellow>Refactored</color> DeepMiner to inherit from DeviceInputOutputImportExportCircuit. This is to allow CombustionDeepMiner to inherit DeepMiner behaviour.
- <color=green>Added</color> deltaTime argument to OnServerExportTick() function.
- <color=yellow>Fixed</color> Rocket Mass contribution from mined ores/ices would only get updated on load or when rocket was modified. It now gets updated correctly when ores are added or removed from the cargo bay.
- <color=green>Added</color> new readable LogicTypes to the Beacon. Players can now read the PositionX, PositionY and PositionZ logic types from a beacon.
- <color=yellow>Fixed</color> Issue with MineablesInQueue logic type. It now correctly returns the number of mineables that an Aimee robot will attempt to gather. Aimee robots will also not target the same mineables as another Aimee.
- <color=red>Removed</color> a few more old/unused prefabs from Resources which had missing scripts on them.
- <color=yellow>Committed</color> missing scene change and applied change to GameControllers prefab.
- <color=red>Removed</color> a bunch more assets from Resources that were unused. Moved a few still used assets from Resources to their appropriate folders. Removed a few other unused old c# classes.
- <color=red>Removed</color> a few unused assets from Resources folder.
- <color=red>Removed</color> terrain testing scene as it is no longer needed and had references to removed scripts.
- <color=red>Removed</color> some unused, empty and missing scripts on the playercontrollers prefab.
<size=20><b>[Version 0.2.6136.26812]</b></size>
- <color=yellow>Fixed</color> Deconstructing PressureFed Liquid engine would return wrong kit.
- <color=yellow>Changed</color> viewport mask on plant analyser to rect mask in a attempt to fix content going out of bounds of the screen for some players.
<size=20><b>[Version 0.2.6135.26809]</b></size>
- <color=yellow>Moved</color> network analyser panel to its own prefab and changed scroll rect mask type to rect2d in an attempt to fix text appearing outside of the scroll rect for some players.
<size=20><b>[Version 0.2.6134.26807]</b></size>
- <color=green>Added</color> fall-back behaviour for server hosting that was present in the old version of rocketnet. 
<size=20><b>[Version 0.2.6133.26805]</b></size>
- <color=yellow>Added</color> very rough first pass on a orbital launch mount payload object to go into the rocket payload bay. This can be used to deploy a launch mount in low orbit. Currently set to not spawnable.
<size=20><b>[Version 0.2.6132.26803]</b></size>
- <color=green>missing</color> file from prior commit
- <color=yellow>Changed</color> Get IPv4Adress to use the raknet functions for getting host ip address.
- <color=yellow>Changed</color> Filtered out loopback addresses when trying to automatically get IPv4 address.
- <color=green>Added</color> further logging when getting ip address.
- <color=green>Added</color> If server fails to host it will re-attempt up to 3 times.
<size=20><b>[Version 0.2.6131.26800]</b></size>
- <color=green>Added</color> some additional logs when hosting a server fails or is aborted.
- <color=yellow>Fixed</color> If raknet fails to start hosting server will be correctly aborted.
- <color=yellow>Added</color> new model for rocket crew module. Removed player slot and screen from crew module and added two separate objects for these - to be build inside the module. Building restricions are not in place yet and models are placeholder.
- <color=yellow>Refactored</color> RocketPayload.cs to abstract class and added DeliveryPayload class for functionality unique to the PayloadDeliveryContainer.
- <color=yellow>Fixed</color> IC10 code was not running on Harm Suit.
- <color=yellow>Fixed</color> clipping issue with Small Fridge where Fries would clip through the door when it was closed. The rendering of items in Fridge slots is now also disabled when either Fridge variant is closed.
<size=20><b>[Version 0.2.6128.26791]</b></size>
- <color=yellow>Fixed</color> issue with text on Airlock control being spelled incorrectly. Used to be: "Presurize". Has been changed to spell: "Pressurize"
- <color=yellow>Changed</color> Updated Sorter and Logic Sorter to new model.
- <color=yellow>Fixed</color> issue with emotes where the None emote would cause other players in multiplayer to see your expression as Dead and removed dropdown for changing expressions in character customization.
- <color=yellow>Fixed</color> Orientation and position of liquid canister when placing it inside a PortableComposter
<size=20><b>[Version 0.2.6127.26786]</b></size>
- <color=yellow>Fixed</color> Zrillians were respawning without Emergency Suit in Stationeer Difficulty.
- <color=yellow>Fixed</color> Localization issue with FireExtinguisher liquid canister slot name.
