<size=20><b>[Version 0.2.6337.27337]</b></size>
- <color=green>Added</color> Waste Packets as disposable alternative to Water Bottles to avoid the water bottle spam when starting a new game.
- <color=yellow>Added</color> a very small normal offset on the cursor position when placing structures. This should fix rounding issues which could place the structure cursor inside an existing structure. This was very noticable for chutes.
- <color=green>Changed</color> cryotube to have two status panels as they were getting very long. The second panel contains the details of the occupant, as well as the organ states.
- <color=green>Added</color> a 'soiling' mechanic that is triggered at 100% sanitation need. When this occurs, the character will automatically 'evacuate' their sanitation need, either into the suit or onto the ground. If the suit is soiled, the player will receive a critical notification. This can be cleared using either the flush command, or via the suit storage system.
- <color=green>Added</color> Rockets can now transfer gasses and liquids to other rockets at the some location using the transfer action. Once clicking the transfer action a list of valid transfer sources will populate, select the target umbilical on the rocket to which you wish to transfer to. Gas is transferred via the mix rule (i.e using the same logic as the umbilical uses when transferring to and from the tower.
- <color=yellow>Fixed</color> when in the crew module chair you would not use the crew module atmosphere.
- <color=yellow>Fixed</color> thumbnail tool from creating colour variants for structures
- <color=yellow>Fixed</color> crew module vent insulation and vent valve's on/off position was inverted.
- <color=green>Added</color> thumbnail editor and redid thumbnails for paintable items for the new colours
- <color=yellow>Updated</color> crew module active and passive vent models and blueprints.
- <color=yellow>Fixed</color> (beta) missing strings for new fuselage pieces.
- <color=green>Added</color> filter and coolant slot tracking to SuitStorage internal stack.
<size=20><b>[Version 0.2.6336.27321]</b></size>
- <color=yellow>Fixed</color> (pre-beta) missing announce files.
- <color=green>Added</color> 'announce' command that displays a popup on all clients when sent from the server. Useful for server hosters for things like announcing a server restart.
- <color=yellow>Fixed</color> (beta) Fuselage E kit missing string, and other minor updates to fuselage E pieces.
- <color=yellow>Fixed</color> (beta) sanitation need was displaying much earlier than intended, as I had lowered it to speed up testing.
- <color=green>Added</color> Transfer Action to Rocket Action panel. The transfer action allows for moving resources between rockets that are at the same location. Each Umbilical on the selected rocket will generate a transfer progress widget. The target umbilical of the rocket you wish to transfer too must be selected for the transfer to take place. Currently this is only enabled for power umbilicals. Gas and chute umbilicals will follow shortly.
<size=20><b>[Version 0.2.6334.27312]</b></size>
- <color=green>Added</color> full sanitation loop. Includes an OrganStomach that now takes in liquid water and, over time, processes it into polluted water. This is then expelled when the user uses a toilet. Includes the addition of a new command (organs) to be used for debugging. Next step is to include a small quantity of water from consumed food.
- <color=green>Changed</color> CO2 exhaling to come out at body temperature, rather than the old value of 20 degrees C.
- <color=yellow>Added</color> active and passive vents for rocket crew module. These inherit from the base active and passive vent classes but use the crew module internal atmos rather than the world atmos.
- <color=yellow>Added</color> in DynamicThing SetWorldAtmosphere() a StructuralArray check to see if the thing is inside a crew module. If so the world atmosphere will be set to the crew modules internal atmosphere. This is a little experimental - possible changes to this maybe come later.
- <color=yellow>Fixed</color> crew parts missing from worldmanager prefabs list
- <color=red>Reverted</color> changes to cinematic camera features possibly causing breaking character IK and FOV
