<size=20><b>[Version 0.2.6384.27598]</b></size>
- <color=yellow>Fixed</color> a multiplayer desync where distant clients could permanently lose world state; actions taking tens of seconds or never appearing, while other clients were unaffected. The StateTick delta stream was a markerless byte sequence, so once reassembly slipped a boundary it could never resynchronize and silently stopped applying world state for the rest of the session. Each StateTick message now carries a small [tag][cycleId] frame: the receiver always re-locks on the next header and, on any inconsistency, drops at most one tick instead of corrupting permanently. The resync event is logged once per episode, and clients reset reassembly state on connect.
- <color=yellow>Changed</color> StateTick reassembly to reuse a grow-on-demand receive buffer instead of allocating a new array every tick. This removed several MB/s of GC churn on a busy server, and changed the client join-data send to stream slices of the packaged snapshot directly rather than allocating and byte-copying a new array per fragment.
