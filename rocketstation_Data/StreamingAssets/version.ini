<size=20><b>[Version 0.2.6330.27281]</b></size>
- <color=yellow>Fixed</color> Null Reference Exception thrown by AdvancedTablet.DeerializeDeltaState.
- <color=yellow>Fixed</color> IC10 search windows would briefly show the correct results for a search, and then yeet them away and show everything after a few frames. Now after typing in the search window, the results will displayed and won't be reset until a new search is initiated as intended.
- <color=green>Added</color> ROR, ROL, CLAMP, and SGN instructions to IC10.
- <color=yellow>Fixed</color> cable networks not reporting StackSize LogicType to read the total number of a attached devices in a cable network. This was fixed by community member AproposMath many months ago and their fix is now integrated into main branch at long last.
- <color=yellow>Fixed</color> indirect register access in L and S instructions in IC10. The regex now matches one or more leading rs, so rr2, rrr5, etc. now resolve as device variables. The pre-existing code only handled a single leading r (r0�r15), so the multi-r indirect/recursive forms previously fell through to the alias path and failed. Credit to AproposMath again, many months ago, again.
- <color=yellow>Fixed</color> access to defined numbers in L and S instructions. A defined name used in the device-operand position is now resolved via chip._Defines. Credit to AproposMath.
- <color=green>Added</color> internal stack to silo. Stack is populated with prefabhash and quantity. The quantity is truncated at 13 bits, giving plenty of room for quantity values for stacks. Each index in the stack is associated with the relevant slot value.
- <color=green>Optimized</color> Silo. Was using a coroutine, now embedded within OnServerTick like other devices.
- <color=green>Added</color> Pressure, Temperature, VolumeOfLiquid, Volume as logic values to read the internal atmosphere for the IceCrusher.
- <color=yellow>Fixed</color> LogicHashGen again, as there was a second bug in the way of things working. Cleaned up the unneeded unitask as well.
- <color=green>Optimized</color> FragmentHandler to use BlockCopy pattern and a stackalloc header.
- <color=yellow>Fixed</color> (beta) logspam caused by stale client messages that could be no op ignored anyway.
- <color=green>Cleanup</color> of some old event code.
<size=20><b>[Version 0.2.6329.27269]</b></size>
- <color=green>Added</color> trading using hands as storage now considered slots within the item in hands (and children). This follows the same rules as drag-all-of-type, whereby slots are ignored from trading unless they are a generic slot (none) or ore slots. Otherwise they are ignored by the trading system specifically. This means you can trade with boxes and consider the contents of them.
- <color=green>Added</color> Healing moodlet. This is a green moodlet that indicates when a player is inside a device that is healing them, such as a cryotube.
- <color=green>Optimized</color> byte-by-byte loops on big buffers inside JoinFragmentMessage Deserialize, Serialize, Process. Also IntegratedCircuitUpdate Deserialize/Serialize.  For megabyte-sized fragments at join time, would have been millions of virtual dispatches against the stream when a single _stream.Read(Bytes, 0, size) would do the job.
- <color=green>Optimized</color> DynamicThingPosition.SetUpdateFlags take the comparison struct by value. Change DynamicThingPosition lastSentValues -> in DynamicThingPosition lastSentValues.
- <color=green>Optimized</color> Empty base.Process(hostId) calls everywhere. Minor, but probably added up as a lot of messages can be processed in multiplayer.
- <color=yellow>Fixed</color> (pre-beta) missing DeferredMessageQueue.cs file.
- <color=green>Replaced</color> WaitUntilFound in NetworkMessageProcessor with a new DeferredMessageQueue. For client->server removed entirely, as was redundant. New pattern closely models SyncList, hooked in with Referencable ReferenceId assignment. Solves one latent error that existed where state was dropped. Additionally removed GC churn and LINQ usage etc.
- <color=yellow>Fixed</color> (pre-beta) missing references in world manager for new prefabs, GUIDs got eaten by unity.
- <color=green>Added</color> new Type E fuselage variant. While we already have plenty, this new variant features entirely paintable area, so you can make a rocket completely colored in your desired color. Also included a variant engine-plate that contains clipped-delta fins. They are visual only.
- <color=yellow>Fixed</color> longstanding bug with Logic Hash Generator that meant it was completely broken in multiplayer. This bug existed since the multiplayer refactor. The client was sending the update message, but was not specifying the logic type to be applied so silently failing.
- <color=green>Added</color> a new "ExcludeFromBounds" tag, and applied to clipped delta fins. This means that the mesh will not change the bounds, and be visual only.
- <color=green>Replaced</color> the many primitive colliders on some nose-cones with a simple convex mesh collider that will be cheaper in our newer version of unity than previously.
- <color=yellow>Changed</color> map motherboard beacon tracking icons to use beacon's painted color.
