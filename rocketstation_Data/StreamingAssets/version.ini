- <color=yellow>Fixed</color> distant light flares did not obey the curved position of the spherized terrain.
- <color=green>Added</color> first pass of unlimited distance proxy mesh rendering. This system makes heavy use of my allocation-free stackalloc buffer handling of Thing references. A buffer of up to 1023 distant LargeStructure will be drawn. A sorted buffer is made during the existing OcclusionManager thread pass, with the render done on Main Thread in LateUpdate. The instance is prepared using the rough bounds, color, and rotation. This blends with the rendering. The net effect is being able to see your base at any distance.
